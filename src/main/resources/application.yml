spring:
  application:
    name: vet-manager-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms
      lettuce:
        shutdown-timeout: 2000ms
        command-timeout: 2000ms

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

vet:
  security:
    jwt:
      public-key: classpath:${JWT_PUBLIC_KEY_PATH}
      private-key: classpath:${JWT_PRIVATE_KEY_PATH}